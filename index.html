<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONNECT+24</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--surf:#f0f4f9;--hov:#e9eef6;--tx:#1f1f1f;--mut:#5f6368;--pri:#0b57d0;--onpri:#fff;--bd:#e1e3e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#131314;--surf:#1e1f20;--hov:#2a2b2d;--tx:#e3e3e3;--mut:#9aa0a6;--pri:#a8c7fa;--onpri:#062e6f;--bd:#37393b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#131314;--surf:#1e1f20;--hov:#2a2b2d;--tx:#e3e3e3;--mut:#9aa0a6;--pri:#a8c7fa;--onpri:#062e6f;--bd:#37393b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:"Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
.hide{display:none!important}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none}
input[type=text]{-webkit-appearance:none;appearance:none;width:100%;padding:14px 16px;margin-bottom:12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
input[type=text]:focus{outline:2px solid var(--pri);outline-offset:-1px}
#join{display:flex;align-items:center;justify-content:center;height:100%;padding:16px}
.card{width:100%;max-width:400px;padding:36px 28px;border:1px solid var(--bd);border-radius:28px;background:var(--bg)}
h1{margin:0 0 6px;font-size:28px;font-weight:500;color:var(--pri)}
p.s{margin:0 0 24px;color:var(--mut);font-size:14px}
.btn{width:100%;padding:12px;border:0;border-radius:20px;background:var(--pri);color:var(--onpri);font-weight:500;font-size:15px}
.btn:hover{opacity:.9}
#app{display:flex;flex-direction:column;height:100%;max-width:960px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--bg)}
header::before{content:"#";display:flex;align-items:center;justify-content:center;width:40px;height:40px;margin-right:6px;border-radius:50%;background:var(--surf);color:var(--pri);font-size:20px;font-weight:500;flex:none}
header b{flex:1;font-size:18px;font-weight:500;line-height:1.2;min-width:0}
header small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.lv{background:none;border:0;color:var(--pri);border-radius:16px;padding:8px 12px;font-weight:500}
.lv:hover{background:var(--surf)}
#msgs{flex:1;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column}
.m{display:flex;gap:12px;padding:6px 16px;align-items:flex-start}
.m:hover{background:var(--surf)}
.av{width:36px;height:36px;flex:none;border-radius:50%;color:#fff;font-weight:500;font-size:16px;display:flex;align-items:center;justify-content:center}
.b{min-width:0;flex:1}
.h{display:flex;align-items:baseline;gap:8px}
.n{font-weight:500;font-size:14px}
.m.me .n{color:var(--pri)}
.t{font-size:12px;color:var(--mut)}
.tx{margin-top:2px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.b img,.b video{max-width:min(100%,360px);max-height:320px;border-radius:12px;display:block;margin-top:6px;background:var(--surf)}
form{display:flex;gap:8px;align-items:center;margin:8px 12px 12px;padding:6px 8px;background:var(--surf);border-radius:28px}
form input[type=text]{margin:0;flex:1;border:0;background:transparent;padding:10px 8px}
form input[type=text]:focus{outline:none}
.ic{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:transparent;color:var(--mut);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ic:hover{background:var(--hov)}
.ic.go{background:var(--pri);color:var(--onpri);font-size:16px}
#st{text-align:center;color:var(--mut);font-size:12px;min-height:0;padding:0 8px}
@media(max-width:480px){header{flex-wrap:wrap}.m{padding:6px 12px}}

:root{--oth:#f0f4f9;--mine:#d3e3fd;--chat:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--oth:#2a2b2d;--mine:#0842a0;--chat:#131314}}
:root[data-theme="dark"]{--oth:#2a2b2d;--mine:#0842a0;--chat:#131314}
#msgs{padding:16px;gap:8px;background:var(--chat)}
.m{padding:0;gap:0;align-items:flex-end;background:none!important}
.m.me{justify-content:flex-end}
.av{display:flex;width:32px;height:32px;margin-right:8px;font-size:14px;align-self:flex-end}
.m.me .av{display:none}
.b{flex:none;display:flex;flex-direction:column;max-width:min(78%,520px);padding:8px 14px 6px;border-radius:18px;background:var(--oth)}
.m:not(.me) .b{border-bottom-left-radius:4px}
.m.me .b{background:var(--mine);border-bottom-right-radius:4px}
.h{display:contents}
.n{order:0;font-size:12px;font-weight:500;margin-bottom:2px;color:var(--mut)}
.m.me .n{color:var(--pri)}
.tx,.b img,.b video{order:1}
.t{order:3;align-self:flex-end;font-size:11px;margin-top:2px;color:var(--mut)}
@media(max-width:480px){.b{max-width:80%}}
#pc{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:14px;background:var(--surf);color:var(--tx);font-size:13px;font-weight:500;white-space:nowrap}
#rs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

:root{--oth:#fff;--mine:#d9fdd3;--chat:#efeae2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--oth:#202c33;--mine:#144d37;--chat:#0b141a}}
:root[data-theme="dark"]{--oth:#202c33;--mine:#144d37;--chat:#0b141a}
#msgs{padding:12px 10px;gap:3px;background:var(--chat)}
.m{padding:0;gap:0}
.b{display:block;position:relative;max-width:82%;padding:6px 8px 6px 10px;border-radius:10px;box-shadow:0 1px .5px rgba(0,0,0,.13);background:var(--oth)}
.m.me .b{background:var(--mine);border-top-right-radius:0}
.m:not(.me) .b{border-top-left-radius:0}
.b::after{content:"";display:block;clear:both}
.n{display:block;font-size:12.5px;font-weight:500;margin-bottom:1px}
.m.me .n{color:var(--mut)}
.tx{display:inline;margin:0;font-size:16px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.t{float:right;margin:8px 0 -2px 12px;font-size:11px;line-height:1;color:var(--mut)}
.b img,.b video{display:block;max-width:100%;max-height:340px;border-radius:8px;margin:2px 0 4px}
.b audio{display:block;width:min(260px,68vw);height:40px;margin:2px 0}
form{display:flex;gap:6px;align-items:center;margin:6px 8px 8px;padding:0;background:none;border-radius:0}
.pill{flex:1;display:flex;align-items:center;gap:2px;background:var(--oth);border-radius:26px;padding:2px 6px 2px 14px;min-height:48px;border:1px solid var(--bd)}
.pill input[type=text]{flex:1;border:0;background:transparent;margin:0;padding:10px 6px;color:var(--tx);font-size:16px}
#mic,#sd{width:48px;height:48px;background:#25d366;color:#fff;font-size:20px}
#rbar{display:none;flex:1;align-items:center;gap:10px;padding:8px 4px;color:var(--tx)}
form.rec #rbar{display:flex}
form.rec .pill input[type=text],form.rec .pill label{display:none}
.dot{width:10px;height:10px;border-radius:50%;background:#f15c6d;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#pc{cursor:pointer}
#mb{position:fixed;top:0;right:0;bottom:0;width:260px;max-width:85vw;z-index:20;background:var(--bg);border-left:1px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 14px;transform:translateX(100%);transition:transform .2s;overflow-y:auto}
#mb.open{transform:none;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:16px}
#ml{list-style:none;margin:0;padding:0}
#ml li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;overflow-wrap:anywhere}
#ml li::before{content:"";width:9px;height:9px;border-radius:50%;background:#22c55e;flex:none}
#ml li:hover{background:var(--surf)}
</style></head><body>
<div id="join"><div class="card">
<h1>CONNECT+24</h1><p class="s">Join a room and chat with photos and videos.</p>
<input type="text" id="nm" placeholder="Your name" maxlength="24">
<input type="text" id="rm" placeholder="Room code (e.g. 234)" maxlength="30">
<p class="s" style="margin:-2px 0 16px;font-size:12px">Use the same code on every device. The room is created automatically.</p>
<button class="btn" id="go">Join room</button>
</div></div>
<div id="app" class="hide">
<aside id="mb"><div class="mh"><b>Online now</b><button class="lv" id="mx">✕</button></div><ul id="ml"></ul></aside>
<header><b id="rt">Room<small id="rs"></small></b><span id="pc" title="People in room">👥 1</span><button class="lv" id="rf" title="Refresh">⟳ Refresh</button><button class="lv" id="cl">Clear chat</button><button class="lv" id="lv">Leave</button></header>
<div id="msgs"></div><div id="st"></div>
<form id="f"><div class="pill"><input type="text" id="tx" placeholder="Message" autocomplete="off"><label class="ic">📎<input type="file" id="fl" accept="image/*,video/*" hidden></label></div>
<button class="ic" id="sd" type="submit">➤</button></form>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
const $=id=>document.getElementById(id);
let db,assets,uid="anon",room,unsub,name="",ids=[];
const ls={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
try{localStorage.removeItem("ipc_name")}catch(e){}$("nm").value="";try{localStorage.removeItem("ipc_room")}catch(e){}$("rm").value="";
const clean=s=>s.toLowerCase().replace(/[^a-z0-9-]/g,"-").replace(/^-+|-+$/g,"").slice(0,30);
// ====== 1) PASTE YOUR FIREBASE CONFIG HERE (see README.md) ======
const firebaseConfig={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",storageBucket:"YOUR_PROJECT.appspot.com",messagingSenderId:"000000000000",appId:"YOUR_APP_ID"};
// =================================================================
const configured=Object.values(firebaseConfig).every(v=>v&&!String(v).startsWith("YOUR_")&&v!=="000000000000");
if(configured)firebase.initializeApp(firebaseConfig);
(async()=>{
 if(!configured){$("st").textContent="Add your Firebase config to index.html before using shared rooms.";return}
 try{await firebase.auth().signInAnonymously();uid=firebase.auth().currentUser.uid;db=firebase.firestore()}
 catch(e){$("st").textContent="Couldn\u2019t connect. Enable Anonymous sign-in in Firebase and check your config."}
 try{const st=firebase.storage();assets={upload:async f=>{const r=st.ref("rooms/"+room+"/"+Date.now()+"_"+f.name.replace(/[^\w.-]/g,"_"));await r.put(f);return{url:await r.getDownloadURL()}}}}catch(e){}
 if(!assets)$("fl").parentElement.classList.add("hide");
})();
$("go").onclick=()=>{
 name=$("nm").value.trim()||"Guest";room=clean($("rm").value);
 if(!room){$("rm").focus();return}
 if(!db){$("st").textContent="Shared rooms are not ready. Check the Firebase setup in index.html.";return}
 location.hash=room;
 $("join").classList.add("hide");$("app").classList.remove("hide");
 $("rt").firstChild.textContent="#"+room;$("rs").textContent="CONNECT+24";
 const box=$("msgs");box.innerHTML="";
 startPresence();unsub=db.collection("rooms/"+room+"/msgs").orderBy("t","asc").limit(300).onSnapshot(s=>{
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  box.innerHTML="";ids=[];
  const clr=+ls.get("ipc_clr_"+room)||0;
  s.docs.forEach(d=>{const m=d.data();if(m.t<=clr)return;ids.push(d.id);box.appendChild(render(m))});
  if(near||!box.dataset.init){box.scrollTop=box.scrollHeight;box.dataset.init=1}
 },e=>{$("st").textContent="Couldn't load messages."});
};
function hue(x){let h=0;for(const c of x)h=(h*31+c.charCodeAt(0))%360;return h}
function render(m){
 const d=document.createElement("div");d.className="m"+(m.uid===uid?" me":"");
 const nm=m.name||"Guest";
 const b=document.createElement("div");b.className="b";
 const n=document.createElement("span");n.className="n";n.textContent=nm;n.style.color=m.uid===uid?"":"hsl("+hue(nm)+",65%,55%)";b.appendChild(n);
 if(m.url&&m.kind==="image"){const i=document.createElement("img");i.src=m.url;i.loading="lazy";b.appendChild(i)}
 if(m.url&&m.kind==="video"){const v=document.createElement("video");v.src=m.url;v.controls=true;v.preload="metadata";v.playsInline=true;b.appendChild(v)}
 if(m.text){const t=document.createElement("span");t.className="tx";t.textContent=m.text;b.appendChild(t)}
 const tm=document.createElement("span");tm.className="t";tm.textContent=new Date(m.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});b.appendChild(tm);
 d.appendChild(b);return d;
}
async function send(extra){
 const text=$("tx").value.trim();
 if(!text&&!extra)return;
 $("tx").value="";
 try{await db.collection("rooms/"+room+"/msgs").add(Object.assign({uid,name,text,t:Date.now()},extra||{}))}
 catch(e){$("st").textContent="Couldn't send. You may need to be signed in with write access."}
}
$("f").onsubmit=e=>{e.preventDefault();send()};
$("fl").onchange=async e=>{
 const f=e.target.files[0];e.target.value="";if(!f||!assets)return;
 const kind=f.type.startsWith("video")?"video":f.type.startsWith("image")?"image":"";
 if(!kind)return;
 if(f.size>20*1024*1024){$("st").textContent="File too large (max 20 MB).";return}
 $("st").textContent="Uploading…";
 try{const r=await assets.upload(f);$("st").textContent="";await send({url:r.url,kind})}
 catch(err){$("st").textContent="Upload failed."}
};
const sid=Math.random().toString(36).slice(2);let pTimer,pInt,pUnsub,pSeen={},pFirst=true;
function drawCount(){
 const on=Object.entries(pSeen).filter(([k,x])=>Date.now()-x.seen<45000);const n=Math.max(on.length,1);
 $("pc").textContent="👥 "+n;$("pc").title=n+(n===1?" person":" people")+" online — tap to see names";
 const l=$("ml");l.innerHTML="";
 const rows=on.length?on:[[sid,{name}]];
 rows.forEach(([k,x])=>{const li=document.createElement("li");li.textContent=(x.name||"Guest")+(k===sid?" (you)":"");l.appendChild(li)});
}
$("pc").onclick=()=>$("mb").classList.toggle("open");$("mx").onclick=()=>$("mb").classList.remove("open");
if(innerWidth>=1300)$("mb").classList.add("open");
$("rf").onclick=()=>{const b=$("rf");b.textContent="⟳ Refreshing…";stopPresence();if(unsub)unsub();unsub=null;$("go").onclick();setTimeout(()=>{b.textContent="⟳ Refresh";$("st").textContent="Refreshed.";setTimeout(()=>{if($("st").textContent==="Refreshed.")$("st").textContent=""},2000)},900)};
function pBeat(){if(room&&db)db.doc("rooms/"+room+"/presence/"+sid).set({name,t:Date.now()}).catch(()=>{})}
function startPresence(){
 pSeen={};pFirst=true;pBeat();pTimer=setInterval(pBeat,15000);pInt=setInterval(drawCount,5000);
 pUnsub=db.collection("rooms/"+room+"/presence").onSnapshot(s=>{
  const now=Date.now(),cur={};let fresh=false;
  s.docs.forEach(d=>{const x=d.data(),o=pSeen[d.id];
   if(o&&o.t===x.t)cur[d.id]=o;
   else if(pFirst&&d.id!==sid)cur[d.id]={t:x.t,name:x.name,seen:0};
   else{cur[d.id]={t:x.t,name:x.name,seen:now};if(!o&&d.id!==sid)fresh=true}});
  pSeen=cur;if(pFirst)pFirst=false;else if(fresh)pBeat();drawCount()},()=>{});
}
function stopPresence(){clearInterval(pTimer);clearInterval(pInt);if(pUnsub)pUnsub();pUnsub=null;try{db.doc("rooms/"+room+"/presence/"+sid).delete().catch(()=>{})}catch(e){}pSeen={}}
addEventListener("pagehide",()=>{if(room)try{db.doc("rooms/"+room+"/presence/"+sid).delete().catch(()=>{})}catch(e){}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&room){pBeat();drawCount()}});
addEventListener("pageshow",()=>{if(room)pBeat()});
$("cl").onclick=async()=>{
 if(!ids.length){$("st").textContent="Nothing to clear.";return}
 if(!$("cl").dataset.sure){$("cl").dataset.sure=1;$("cl").textContent="Tap again to confirm";$("st").textContent="This clears the chat on your screen only. Others keep their messages.";setTimeout(()=>{delete $("cl").dataset.sure;$("cl").textContent="Clear chat"},4000);return}
 delete $("cl").dataset.sure;$("cl").textContent="Clear chat";
 $("st").textContent="Clearing…";
 try{ls.set("ipc_clr_"+room,String(Date.now()));$("msgs").innerHTML="";ids=[];$("st").textContent="Chat cleared on your screen only."}
 catch(e){$("st").textContent="Couldn't clear the chat: "+((e&&e.message)||"you may not have permission")}
};
$("lv").onclick=()=>{$("nm").value="";$("rm").value="";stopPresence();if(unsub)unsub();$("app").classList.add("hide");$("join").classList.remove("hide");history.replaceState(null,"",location.pathname)};
</script></body></html>
